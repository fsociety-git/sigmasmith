positive:
  - name: Classic sshd line
    event:
      message: "Accepted password for root from 203.0.113.9 port 51234 ssh2"
      hostname: vps-ops-01
  - name: Journald style with nested field
    event:
      MESSAGE: "sshd[1234]: Accepted password for root from 198.51.100.4 port 2222 ssh2"
negative:
  - name: Key-based root login
    event:
      message: "Accepted publickey for root from 203.0.113.9 port 51234 ssh2: ED25519 SHA256:abc"
  - name: Password login for a normal user
    event:
      message: "Accepted password for deploy from 203.0.113.9 port 51234 ssh2"
  - name: Failed root password
    event:
      message: "Failed password for root from 203.0.113.9 port 51234 ssh2"
