title: SSH Root Login Accepted With Password
id: 00eaf965-9198-4453-9b66-89c7ca8b2543
status: experimental
description: |
  Detects a successful password-based SSH login as root. Hardened hosts disable both root login and password
  authentication; an accepted root password means the configuration drifted, was reverted by an attacker, or
  the host was never hardened. Treat as high priority on any internet-facing server.
references:
  - https://attack.mitre.org/techniques/T1078/003/
  - https://attack.mitre.org/techniques/T1021/004/
  - https://man.openbsd.org/sshd_config#PermitRootLogin
author: Aman Sonkamble
date: 2026-10-19
tags:
  - attack.initial-access
  - attack.lateral-movement
  - attack.t1078.003
  - attack.t1021.004
logsource:
  product: linux
  service: sshd
detection:
  keywords:
    - 'Accepted password for root from'
  condition: keywords
falsepositives:
  - Lab machines with intentionally permissive sshd configuration
level: high
